<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Clique para Copiar o Link</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    #copyButton {
      padding: 15px 25px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }
    #copyButton:hover {
      background: #0056b3;
    }
    #msg {
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Abra o protótipo</h1>

  <p>Clique no botão abaixo para copiar o link.</p>

  <button id="copyButton">Copiar Link</button>

  <p id="msg"></p>

  <script>
    const link = "https://www.figma.com/proto/G4HZWSuX1qGFzOHiIO98Ez/02_cidade_teste_com_menu?node-id=3314-195&t=EUegFNjF6zW44Moi-1";

    document.getElementById("copyButton").addEventListener("click", () => {
      navigator.clipboard.writeText(link).then(() => {
        document.getElementById("msg").innerText = "Link copiado! Agora cole no navegador e abra no Chrome.";
      }).catch(() => {
        document.getElementById("msg").innerText = "Falha ao copiar. Tente manualmente.";
      });
    });
  </script>

</body>

</html>
